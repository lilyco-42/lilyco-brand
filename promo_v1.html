<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>lilyco — 让人类远离计算机，AI 可做任何事</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#F5EDE2}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;
    font-family:"幼圆","YouYuan","Yuanti SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .layer{position:absolute;inset:0;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(90px)}
  #b1{width:760px;height:700px;left:-140px;top:-160px;background:rgba(242,185,203,.55)}
  #b2{width:860px;height:800px;left:1280px;top:520px;background:rgba(168,184,224,.50)}
  #b3{width:560px;height:520px;left:760px;top:-140px;background:rgba(240,220,170,.42)}
  #card{position:absolute;left:100px;top:80px;width:1720px;height:920px;border-radius:56px;
    background:rgba(255,255,255,.66);border:3px solid #EBCFD8;
    box-shadow:0 30px 90px rgba(203,160,180,.28), inset 0 0 140px rgba(255,255,255,.65)}
  .fl{position:absolute;left:0;top:0;will-change:transform,opacity}
  #word{left:960px;top:0;font-family:"Segoe Print","Segoe Script","Comic Sans MS",cursive;
    font-size:160px;line-height:1;color:#5A4A52;letter-spacing:4px;white-space:nowrap}
  #word span{display:inline-block;opacity:0}
  #word .co{color:#7E92C6}
  .tag{color:#5A4A52;font-weight:700}
  #t1{left:960px;top:800px;font-size:60px;letter-spacing:10px;opacity:0}
  #t2{left:960px;top:920px;font-size:68px;letter-spacing:12px;color:#7E92C6;opacity:0}
  #e1{left:960px;top:790px;font-size:44px;letter-spacing:6px;color:#6B5A62;opacity:0}
  #e2{left:960px;top:872px;font-size:40px;letter-spacing:5px;color:#7E92C6;font-weight:700;opacity:0}
  #term{left:1500px;top:640px;opacity:0}
  #ul{left:960px;top:856px;opacity:0}
  #wm{position:absolute;left:44px;top:1028px;font-size:26px;color:#8A7580;opacity:0;letter-spacing:2px}
  .pt{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity}
  #grain{mix-blend-mode:multiply;opacity:.055}
</style>
</head>
<body>
<div id="stage">
  <div class="layer">
    <div class="blob fl" id="b1"></div>
    <div class="blob fl" id="b2"></div>
    <div class="blob fl" id="b3"></div>
  </div>
  <div id="card"></div>

  <!-- 百合线稿（品牌花） -->
  <svg id="flower" class="fl" width="420" height="420" viewBox="-210 -210 420 420">
    <path d="M0,-16 C-8,44 6,96 0,152" fill="none" stroke="#96AE93" stroke-width="6" stroke-linecap="round"
      pathLength="1" data-t0="0.50" data-t1="1.20" style="stroke-dasharray:1;stroke-dashoffset:1"/>
    <g stroke="#5A4A52" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path transform="rotate(0)"   d="M0,-18 C-40,-70 -32,-150 0,-188 C32,-150 40,-70 0,-18 Z" fill="#FDF0F4" fill-opacity="0" pathLength="1" data-t0="0.80" data-t1="1.55" data-fill="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>
      <path transform="rotate(72)"  d="M0,-18 C-40,-70 -32,-150 0,-188 C32,-150 40,-70 0,-18 Z" fill="#EFF3FC" fill-opacity="0" pathLength="1" data-t0="1.00" data-t1="1.75" data-fill="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>
      <path transform="rotate(144)" d="M0,-18 C-40,-70 -32,-150 0,-188 C32,-150 40,-70 0,-18 Z" fill="#FDF0F4" fill-opacity="0" pathLength="1" data-t0="1.20" data-t1="1.95" data-fill="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>
      <path transform="rotate(216)" d="M0,-18 C-40,-70 -32,-150 0,-188 C32,-150 40,-70 0,-18 Z" fill="#EFF3FC" fill-opacity="0" pathLength="1" data-t0="1.40" data-t1="2.15" data-fill="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>
      <path transform="rotate(288)" d="M0,-18 C-40,-70 -32,-150 0,-188 C32,-150 40,-70 0,-18 Z" fill="#FDF0F4" fill-opacity="0" pathLength="1" data-t0="1.60" data-t1="2.35" data-fill="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>
    </g>
    <path d="M3,64 C42,54 62,26 72,-6"  fill="none" stroke="#96AE93" stroke-width="5" stroke-linecap="round" pathLength="1" data-t0="1.70" data-t1="2.40" style="stroke-dasharray:1;stroke-dashoffset:1"/>
    <path d="M-3,96 C-42,86 -62,58 -72,26" fill="none" stroke="#96AE93" stroke-width="5" stroke-linecap="round" pathLength="1" data-t0="1.85" data-t1="2.55" style="stroke-dasharray:1;stroke-dashoffset:1"/>
    <circle r="16" fill="#F6D786" fill-opacity="0" stroke="#5A4A52" stroke-width="4" pathLength="1" data-t0="2.20" data-t1="2.70" data-fill="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>
    <circle cx="-34" cy="-46" r="8" fill="#F2B9CB" opacity="0" data-pop="2.75,3.10"/>
    <circle cx="34"  cy="-46" r="8" fill="#F2B9CB" opacity="0" data-pop="2.85,3.20"/>
  </svg>

  <!-- 42 手绘徽章 -->
  <svg id="badge" class="fl" width="150" height="150" viewBox="0 0 150 150">
    <ellipse cx="75" cy="75" rx="64" ry="50" transform="rotate(-5 75 75)" fill="none" stroke="#E3A9BC" stroke-width="5" stroke-linecap="round" pathLength="1" data-t0="1.90" data-t1="2.80" style="stroke-dasharray:1;stroke-dashoffset:1"/>
    <ellipse cx="75" cy="75" rx="60" ry="53" transform="rotate(4 75 75)"  fill="none" stroke="#E3A9BC" stroke-width="4" stroke-linecap="round" pathLength="1" data-t0="2.05" data-t1="2.90" style="stroke-dasharray:1;stroke-dashoffset:1"/>
    <text x="75" y="92" text-anchor="middle" font-family="Segoe Print,Comic Sans MS,cursive" font-size="48" fill="#5A4A52" opacity="0" data-pop="2.50,3.00">42</text>
  </svg>

  <!-- 字标 -->
  <h1 id="word" class="fl"><span>l</span><span>i</span><span>l</span><span>y</span><span class="co">c</span><span class="co">o</span></h1>

  <!-- 主张 -->
  <div id="t1" class="fl tag">让人类远离计算机</div>
  <svg id="ul" class="fl" width="560" height="40" viewBox="0 0 560 40">
    <path d="M10,24 C140,8 300,34 550,14" fill="none" stroke="#E3A9BC" stroke-width="7" stroke-linecap="round" pathLength="1" data-t0="5.40" data-t1="6.20" style="stroke-dasharray:1;stroke-dashoffset:1"/>
  </svg>
  <div id="t2" class="fl tag">AI 可做任何事</div>

  <!-- 终端小涂鸦 -->
  <svg id="term" class="fl" width="250" height="200" viewBox="0 0 250 200">
    <g transform="rotate(-4 125 100)">
      <rect x="5" y="5" width="240" height="150" rx="18" fill="rgba(255,255,255,.92)" stroke="#5A4A52" stroke-width="5"/>
      <line x1="5" y1="45" x2="245" y2="45" stroke="#5A4A52" stroke-width="4" opacity=".45"/>
      <circle cx="32" cy="25" r="7" fill="#E3A9BC"/><circle cx="58" cy="25" r="7" fill="#A8B8E0"/><circle cx="84" cy="25" r="7" fill="#E8C87A"/>
      <text x="30" y="118" font-family="Consolas,monospace" font-size="44" fill="#5A4A52">&gt;</text>
      <rect id="cursor" x="62" y="84" width="26" height="36" fill="#5A4A52" opacity="0"/>
      <path transform="translate(206,128) scale(1.3)" d="M0,-2 C-1.5,-5.5 -6.5,-5 -6.5,-1 C-6.5,2 -2.5,4.5 0,7.5 C2.5,4.5 6.5,2 6.5,-1 C6.5,-5 1.5,-5.5 0,-2 Z" fill="#E3A9BC"/>
    </g>
  </svg>

  <!-- 落版 -->
  <div id="e1" class="fl">让人类远离计算机，AI 可做任何事</div>
  <div id="e2" class="fl">云枢智创 · lain42.top</div>

  <div id="wm">© 2026 lilyco · 云枢智创 lain42.top</div>
  <div id="pts" class="layer"></div>

  <svg id="grain" class="layer" width="1920" height="1080">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="1920" height="1080" filter="url(#n)"/>
  </svg>
</div>

<script>
const DUR=16;
const $=id=>document.getElementById(id);
const stage=$('stage'),card=$('card'),flower=$('flower'),badge=$('badge'),word=$('word'),
      t1=$('t1'),t2=$('t2'),ul=$('ul'),term=$('term'),cursor=$('cursor'),
      e1=$('e1'),e2=$('e2'),wm=$('wm'),pts=$('pts');
const blobs=[$('b1'),$('b2'),$('b3')];
const letters=[...word.querySelectorAll('span')];
const strokes=[...document.querySelectorAll('[data-t0]')];
const pops=[...document.querySelectorAll('[data-pop]')];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eoc=p=>1-Math.pow(1-p,3);
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eob=p=>{const c=2.0,c3=c+1;return 1+c3*Math.pow(p-1,3)+c*Math.pow(p-1,2)};

/* 漂浮粒子（种子固定，逐帧可复现） */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(42);
const star='M0,-14 C1.4,-4 4,-1.4 14,0 C4,1.4 1.4,4 0,14 C-1.4,4 -4,1.4 -14,0 C-4,-1.4 -1.4,-4 0,-14 Z';
const heart='M0,-3 C-2,-8 -9,-7 -9,-1.5 C-9,3 -3.5,6 0,10.5 C3.5,6 9,3 9,-1.5 C9,-7 2,-8 0,-3 Z';
const cols=['#E3A9BC','#A8B8E0','#E8C87A'];
const P=[];
for(let i=0;i<34;i++){
  const isH=i%5===4, c=cols[i%3], s=isH?(1.1+rnd()*.7):(.55+rnd()*.85);
  const el=document.createElement('div'); el.className='pt';
  el.innerHTML='<svg width="44" height="44" viewBox="-22 -22 44 44"><path d="'+(isH?heart:star)+'" fill="'+c+'"/></svg>';
  pts.appendChild(el);
  P.push({el,x:60+rnd()*1800,y:rnd()*1180,vy:14+rnd()*22,vx:(rnd()-.5)*10,tw:.8+rnd()*1.6,ph:rnd()*6.28,s});
}
/* 标语爆闪 */
const burstPos=[[720,800],[1200,830],[830,975],[1090,985],[680,905],[1240,900]];
const B=burstPos.map((p,i)=>{
  const el=document.createElement('div'); el.className='pt';
  el.innerHTML='<svg width="44" height="44" viewBox="-22 -22 44 44"><path d="'+star+'" fill="'+cols[i%3]+'"/></svg>';
  pts.appendChild(el);
  return {el,x:p[0],y:p[1],s:.9+(i%3)*.25};
});

function render(t){
  stage.style.opacity=eoc(seg(t,0,.6));
  const cp=eoc(seg(t,.25,1.05));
  card.style.opacity=cp; card.style.transform='scale('+(.965+.035*cp)+')';
  blobs[0].style.transform='translate('+(40*Math.sin(t*.21))+'px,'+(30*Math.cos(t*.17))+'px)';
  blobs[1].style.transform='translate('+(50*Math.cos(t*.16+2))+'px,'+(36*Math.sin(t*.19+1))+'px)';
  blobs[2].style.transform='translate('+(34*Math.sin(t*.23+4))+'px,'+(26*Math.cos(t*.15+3))+'px)';

  /* 百合：场景1 居中偏大 → 收入落版 */
  const mv=eio(seg(t,3.2,4.6));
  let fy=540+(330-540)*mv, fs=1.7+(1.15-1.7)*mv;
  if(t>4.6) fy=330+Math.sin(t*.7)*8;
  flower.style.transform='translate(-50%,-50%) translate(960px,'+fy+'px) scale('+fs+')';

  /* 42 徽章：花旁 → 字标右侧 */
  const bm=eio(seg(t,3.4,4.8));
  let bx=1320+(1360-1320)*bm, by=360+(655-360)*bm, bs=1+(0.8-1)*bm;
  if(t>4.8) by=655+Math.sin(t*.7+.8)*6;
  badge.style.transform='translate(-50%,-50%) translate('+bx+'px,'+by+'px) scale('+bs+')';

  /* 线稿描边进度 */
  for(const s of strokes){
    const p=eoc(seg(t,+s.dataset.t0,+s.dataset.t1));
    s.style.strokeDashoffset=1-p;
    if(s.dataset.fill) s.setAttribute('fill-opacity',(.9*seg(t,(+s.dataset.t0 + +s.dataset.t1)/2,+s.dataset.t1+.55)).toFixed(3));
  }
  for(const s of pops){
    const a=s.dataset.pop.split(','), p=eoc(seg(t,+a[0],+a[1]));
    s.style.opacity=p.toFixed(3);
  }

  /* 字标 */
  const wy=640+25*mv;
  word.style.transform='translate(-50%,-50%) translateY('+wy+'px)';
  letters.forEach((el,i)=>{
    const p=seg(t,3.6+i*.22,4.15+i*.22), e=eob(p);
    el.style.opacity=eoc(Math.min(1,p*1.7)).toFixed(3);
    el.style.transform='translateY('+(40*(1-eoc(p)))+'px) scale('+(.25+.75*e)+')';
  });

  /* 标语 */
  const f1=1-seg(t,11.0,11.8), p1=eoc(seg(t,4.9,5.9));
  t1.style.opacity=(p1*f1).toFixed(3);
  t1.style.transform='translate(-50%,-50%) translateY('+((1-p1)*30+(t>4.9?Math.sin(t*.8+1.5)*4:0))+'px)';
  ul.style.opacity=(seg(t,5.2,5.6)*f1).toFixed(3);
  const f2=1-seg(t,11.2,12.0), p2=eoc(seg(t,6.3,7.3));
  t2.style.opacity=(p2*f2).toFixed(3);
  t2.style.transform='translate(-50%,-50%) translateY('+((1-p2)*34+(t>7.3?Math.sin(t*.8+2.6)*5:0))+'px)';

  /* 终端涂鸦 */
  const fT=1-seg(t,11.4,12.2), pT=eob(seg(t,6.6,7.4));
  term.style.opacity=(clamp(pT,0,1)*fT).toFixed(3);
  term.style.transform='translate(-50%,-50%) translate(1500px,640px) scale('+clamp(pT,.001,1.15)+') rotate(-4deg)';
  cursor.setAttribute('opacity',(t>7.4&&t<11.4&&Math.sin(t*2*Math.PI*1.8)>0)?1:.12);

  /* 落版 */
  const pe1=eoc(seg(t,12.6,13.8));
  e1.style.opacity=pe1.toFixed(3);
  e1.style.transform='translate(-50%,-50%) translateY('+((1-pe1)*24)+'px)';
  const pe2=eoc(seg(t,13.0,14.2));
  e2.style.opacity=pe2.toFixed(3);
  e2.style.transform='translate(-50%,-50%) translateY('+((1-pe2)*24)+'px)';

  /* 爆闪 */
  B.forEach((b,i)=>{
    const p=seg(t,7.4+i*.12,7.85+i*.12);
    b.el.style.opacity=((p>0?1:0)*(1-seg(t,9.8,10.8))*eoc(p)).toFixed(3);
    b.el.style.transform='translate(-50%,-50%) translate('+b.x+'px,'+b.y+'px) scale('+(Math.max(eob(p),.001)*b.s)+') rotate('+(p*90)+'deg)';
  });

  /* 漂浮粒子 */
  for(const o of P){
    const y=((o.y-t*o.vy)%1180+1180)%1180-40, x=o.x+t*o.vx;
    const edge=clamp(Math.min((y-20)/80,(1040-y)/80),0,1);
    const tw=.5+.5*Math.sin(t*o.tw*2+o.ph);
    o.el.style.opacity=(edge*(.25+.5*tw)*eoc(seg(t,.8,2.2))).toFixed(3);
    o.el.style.transform='translate(-50%,-50%) translate('+x+'px,'+y+'px) scale('+(o.s*(.75+.25*tw)).toFixed(3)+') rotate('+(t*12+o.ph*30)+'deg)';
  }

  wm.style.opacity=(.55*eoc(seg(t,.8,1.8))).toFixed(3);
}

/* 预览自动循环；外部 seek 即接管 */
let auto=true; const t0=performance.now();
(function loop(now){ if(auto) render(((now||0)-t0)/1000%DUR); requestAnimationFrame(loop); })(t0);
window.DUR=DUR;
window.seek=function(t){auto=false;render(t)};
</script>
</body>
</html>
